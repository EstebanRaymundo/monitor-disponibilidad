<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estado de Servicios | Monitor de Disponibilidad</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --up: #22c55e;
      --down: #ef4444;
      --unknown: #64748b;
      --warning-bg: #f59e0b;
      --danger-bg: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 1.5rem 1rem;
      max-width: 800px;
      margin: 0 auto;
    }

    header { margin-bottom: 2rem; }
    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
    
    .meta-info {
      color: var(--text-muted);
      font-size: 0.875rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    /* Banners de obsolescencia y error */
    .alert-banner {
      display: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .alert-banner.warning { display: block; background-color: var(--warning-bg); color: #000; }
    .alert-banner.danger { display: block; background-color: var(--danger-bg); color: #fff; }

    /* Resumen general */
    .summary-card {
      background-color: var(--card-bg);
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Lista de Servicios */
    .services-grid { display: flex; flex-direction: column; gap: 1rem; }

    .service-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .service-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .service-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .service-url {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-decoration: none;
    }
    .service-url:hover { text-decoration: underline; }

    .badge {
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge.up { background-color: rgba(34, 197, 94, 0.2); color: var(--up); }
    .badge.down { background-color: rgba(239, 68, 68, 0.2); color: var(--down); }
    .badge.unknown { background-color: rgba(100, 116, 139, 0.2); color: var(--unknown); }

    /* Métricas */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      background-color: rgba(0, 0, 0, 0.2);
      padding: 0.75rem;
      border-radius: 8px;
      text-align: center;
    }

    .metric-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
    .metric-value { font-size: 0.95rem; font-weight: 600; }

    /* Tira de verificaciones recientes */
    .recent-bar-container {
      display: flex;
      gap: 3px;
      height: 24px;
      align-items: center;
      overflow: hidden;
      width: 100%;
    }

    .bar {
      flex: 1;
      min-width: 3px;
      max-width: 6px;
      height: 100%;
      border-radius: 2px;
    }
    .bar.up { background-color: var(--up); }
    .bar.down { background-color: var(--down); }

    /* Pantalla vacía o de error */
    #error-container {
      display: none;
      background-color: var(--card-bg);
      padding: 2rem;
      border-radius: 10px;
      text-align: center;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <h1>Estado de los Servicios</h1>
    <div class="meta-info">
      <span id="last-update">Cargando...</span>
    </div>
  </header>

  <div id="banner-obsolescencia" class="alert-banner"></div>

  <div class="summary-card" id="summary-card" style="display: none;">
    <span>Servicios Operativos</span>
    <strong id="summary-counts">- / -</strong>
  </div>

  <div id="error-container"></div>
  <div id="services-list" class="services-grid"></div>

  <script>
    const formatter = new Intl.DateTimeFormat(navigator.language, {
      dateStyle: 'short',
      timeStyle: 'medium'
    });

    function formatearFechaLocal(isoString) {
      if (!isoString) return "Sin datos";
      return formatter.format(new Date(isoString));
    }

    function evaluarObsolescencia(generatedAtISO) {
      const banner = document.getElementById("banner-obsolescencia");
      const ahora = new Date();
      const fechaGen = new Date(generatedAtISO);
      const diffMinutos = Math.floor((ahora - fechaGen) / (1000 * 60));

      if (diffMinutos >= 60) {
        banner.className = "alert-banner danger";
        banner.textContent = "⚠️ Advertencia destacada: El monitor podría no estar ejecutándose (Datos de hace más de 1 hora).";
      } else if (diffMinutos >= 30) {
        banner.className = "alert-banner warning";
        banner.textContent = "⚡ Aviso: Los datos podrían no estar actualizados.";
      } else {
        banner.className = "alert-banner";
      }
    }

    fetch("status.json")
      .then(res => {
        if (!res.ok) throw new Error("No se pudo cargar el archivo status.json");
        return res.json();
      })
      .then(data => {
        if (!data || !data.services) throw new Error("Estructura de status.json malformada");

        // Actualizar header
        document.getElementById("last-update").textContent = `Última actualización: ${formatearFechaLocal(data.generated_at)}`;
        evaluarObsolescencia(data.generated_at);

        // Actualizar resumen
        const operativos = data.services.filter(s => s.current === "up").length;
        document.getElementById("summary-counts").textContent = `${operativos} de ${data.services.length} UP`;
        document.getElementById("summary-card").style.display = "flex";

        const container = document.getElementById("services-list");
        container.innerHTML = "";

        data.services.forEach(s => {
          const card = document.createElement("div");
          card.className = "service-card";

          const uptime24 = s.uptime_24h !== null ? `${s.uptime_24h}%` : "sin datos";
          const uptime7d = s.uptime_7d !== null ? `${s.uptime_7d}%` : "sin datos";
          const avgMs = s.avg_response_ms !== null ? `${s.avg_response_ms} ms` : "sin datos";

          // Generar barras recientes
          const barsHTML = s.recent && s.recent.length > 0
            ? s.recent.map(val => `<div class="bar ${val === 1 ? 'up' : 'down'}"></div>`).join('')
            : '<span style="font-size: 0.8rem; color: var(--text-muted)">Sin verificaciones recientes</span>';

          card.innerHTML = `
            <div class="service-header">
              <div>
                <div class="service-title">${s.name}</div>
                <a href="${s.url}" target="_blank" class="service-url">${s.url}</a>
              </div>
              <span class="badge ${s.current}">${s.current}</span>
            </div>

            <div class="metrics-grid">
              <div>
                <div class="metric-label">24 Horas</div>
                <div class="metric-value">${uptime24}</div>
              </div>
              <div>
                <div class="metric-label">7 Días</div>
                <div class="metric-value">${uptime7d}</div>
              </div>
              <div>
                <div class="metric-label">Promedio</div>
                <div class="metric-value">${avgMs}</div>
              </div>
            </div>

            <div>
              <div class="metric-label" style="margin-bottom: 0.25rem;">Verificaciones recientes (últimas 60)</div>
              <div class="recent-bar-container">${barsHTML}</div>
            </div>

            <div style="font-size: 0.75rem; color: var(--text-muted); text-align: right;">
              Último chequeo: ${formatearFechaLocal(s.last_checked)}
            </div>
          `;

          container.appendChild(card);
        });
      })
      .catch(err => {
        const errContainer = document.getElementById("error-container");
        errContainer.style.display = "block";
        errContainer.textContent = `Error al cargar la información del monitor: ${err.message}`;
      });
  </script>
</body>
</html>
