name: Monitor de disponibilidad

on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar verificaciones
        run: python monitor.py
            - name: Copiar estado para GitHub Pages
        run: |
          mkdir -p docs
          cp data/status.json docs/status.json

      - name: Guardar resultados
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data/ docs/status.json
          git diff --staged --quiet || git commit -m "checks: $(date -u +%FT%TZ)"
          git pull --rebase --autostash
          git push